<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alpha Dudes | Aquarium Toys & Accessories</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f9ff;
}
header {
  background: linear-gradient(135deg, #0077b6, #0096c7);
  color: #fff;
  text-align: center;
  padding: 18px;
}
.categories {
  display: flex;
  gap: 10px;
  padding: 10px;
  overflow-x: auto;
  background: #fff;
}
.categories button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 20px;
  background: #e6f4ff;
  font-weight: bold;
}
.categories button.active {
  background: #0077b6;
  color: #fff;
}
.container {
  padding: 12px;
}
.product {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}
.product img {
  width: 100%;
  border-radius: 10px;
}
.product h2 {
  margin: 8px 0 4px;
  font-size: 18px;
}
.price {
  font-weight: bold;
  margin: 6px 0;
}
.add-btn {
  width: 100%;
  padding: 12px;
  background: #0077b6;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
}
.cart {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 2px solid #eee;
  padding: 12px;
}
.cart button {
  width: 100%;
  padding: 14px;
  background: #25D366;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
}
.cart-summary {
  font-size: 14px;
  margin-bottom: 8px;
}
  .whatsapp-float {
  position: fixed;
  bottom: 90px;
  right: 18px;
  background: #25D366;
  color: #fff;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  text-decoration: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  z-index: 999;
}
.whatsapp-float:active {
  opacity: 0.85;
}
</style>
</head>

<body>

<header>
  <h1>Alpha Dudes 🐠</h1>
  <p>Aquarium Toys & Accessories</p>
</header>

<!-- CATEGORY BUTTONS -->
<div class="categories">
  <button class="active" onclick="filterCategory('all', this)">All</button>
  <button onclick="filterCategory('toys', this)">🧸 Toys</button>
  <button onclick="filterCategory('accessories', this)">⚙️ Accessories</button>
  <button onclick="filterCategory('decor', this)">🪸 Decor</button>
</div>

<div class="container">

  <!-- TOYS -->
  <div class="product toys">
    <img src="https://via.placeholder.com/400x250?text=Floating+Fish+Toy">
    <h2>Floating Fish Toy</h2>
    <div class="price">₹299</div>
    <button class="add-btn" onclick="addToCart('Floating Fish Toy',299)">
      Add to Cart
    </button>
  </div>

  <!-- ACCESSORIES -->
  <div class="product accessories">
    <img src="https://via.placeholder.com/400x250?text=Aquarium+Air+Stone">
    <h2>Aquarium Air Stone</h2>
    <div class="price">₹199</div>
    <button class="add-btn" onclick="addToCart('Aquarium Air Stone',199)">
      Add to Cart
    </button>
  </div>

  <!-- DECOR -->
  <div class="product decor">
    <img src="https://via.placeholder.com/400x250?text=Aquarium+Decor">
    <h2>Artificial Coral Decor</h2>
    <div class="price">₹499</div>
    <button class="add-btn" onclick="addToCart('Artificial Coral Decor',499)">
      Add to Cart
    </button>
  </div>

</div>

<!-- CART BAR -->
<div class="cart">
  <div class="cart-summary" id="cartSummary">
    Cart: 0 items | Total ₹0
  </div>
  <button onclick="sendWhatsAppOrder()">
    Send Order on WhatsApp
  </button>
</div>

<script>
let cart = [];

function addToCart(name, price) {
  const item = cart.find(p => p.name === name);
  if (item) {
    item.qty++;
  } else {
    cart.push({ name, price, qty: 1 });
  }
  updateCart();
}

function decreaseQty(name) {
  const item = cart.find(p => p.name === name);
  if (!item) return;

  item.qty--;
  if (item.qty <= 0) {
    cart = cart.filter(p => p.name !== name);
  }
  updateCart();
}

function updateCart() {
  let items = 0;
  let total = 0;

  cart.forEach(i => {
    items += i.qty;
    total += i.price * i.qty;
  });

  document.getElementById("cartSummary").innerText =
    `Cart: ${items} items | Total ₹${total}`;
}

function sendWhatsAppOrder() {
  if (cart.length === 0) {
    alert("Cart is empty!");
    return;
  }

  let msg = "Hi Alpha Dudes 🐠%0AOrder Details:%0A";

  cart.forEach((i, n) => {
    msg += `${n + 1}. ${i.name}  x ${i.qty}  = Rs ${i.price * i.qty}%0A`;
  });

  msg += `%0ATotal Amount: Rs ${cart.reduce((s, i) => s + i.price * i.qty, 0)}`;

  window.open(
    "https://wa.me/917639348470?text=" + msg,
    "_blank"
  );
}
</script>

<a href="https://wa.me/917639348470?text=Hi%20Alpha%20Dudes%20🐠%0AI%20have%20a%20question%20about%20your%20aquarium%20products"
   class="whatsapp-float"
   target="_blank"
   aria-label="Chat on WhatsApp">
  💬
</a>
</body>
</html>
