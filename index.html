<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alpha Dudes | Aquarium Toys & Accessories</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f9ff;
}
header {
  background: linear-gradient(135deg, #0077b6, #0096c7);
  color: #fff;
  text-align: center;
  padding: 18px;
}
.container {
  padding: 12px;
}
.product {
  background: #fff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}
.product img {
  width: 100%;
  border-radius: 10px;
}
.product h2 {
  margin: 8px 0 4px;
  font-size: 18px;
}
.price {
  font-weight: bold;
  margin: 6px 0;
}
.add-btn {
  width: 100%;
  padding: 12px;
  background: #0077b6;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
}
.cart {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #fff;
  border-top: 2px solid #eee;
  padding: 12px;
}
.cart button {
  width: 100%;
  padding: 14px;
  background: #25D366;
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
}
.cart-summary {
  font-size: 14px;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<header>
  <h1>Alpha Dudes 🐠</h1>
  <p>Aquarium Toys & Accessories</p>
</header>

<div class="container">

  <!-- PRODUCT 1 -->
  <div class="product">
    <img src="https://via.placeholder.com/400x250?text=Floating+Fish+Toy">
    <h2>Floating Fish Toy</h2>
    <div class="price">₹299</div>
    <button class="add-btn" onclick="addToCart('Floating Fish Toy',299)">
      Add to Cart
    </button>
  </div>

  <!-- PRODUCT 2 -->
  <div class="product">
    <img src="https://via.placeholder.com/400x250?text=Aquarium+Air+Stone">
    <h2>Aquarium Air Stone</h2>
    <div class="price">₹199</div>
    <button class="add-btn" onclick="addToCart('Aquarium Air Stone',199)">
      Add to Cart
    </button>
  </div>

</div>

<!-- CART BAR -->
<div class="cart">
  <div class="cart-summary" id="cartSummary">
    Cart: 0 items | Total ₹0
  </div>
  <button onclick="sendWhatsAppOrder()">
    Send Order on WhatsApp
  </button>
</div>

<script>
let cart = [];

function addToCart(name, price) {
  const item = cart.find(p => p.name === name);
  if (item) {
    item.qty += 1;
  } else {
    cart.push({ name, price, qty: 1 });
  }
  updateCart();
}

function updateCart() {
  let totalItems = 0;
  let totalPrice = 0;
  cart.forEach(item => {
    totalItems += item.qty;
    totalPrice += item.price * item.qty;
  });
  document.getElementById("cartSummary").innerText =
    `Cart: ${totalItems} items | Total ₹${totalPrice}`;
}

function sendWhatsAppOrder() {
  if (cart.length === 0) {
    alert("Cart is empty!");
    return;
  }

  let message = "Hi Alpha Dudes 🐠%0AOrder Details:%0A";
  cart.forEach((item, i) => {
    message += `${i+1}. ${item.name} x ${item.qty} = Rs ${item.price * item.qty}%0A`;
  });

  let total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  message += `%0ATotal Amount: Rs ${total}`;

  window.open(
    "https://wa.me/91XXXXXXXXXX?text=" + message,
    "_blank"
  );
}
</script>

</body>
</html>
